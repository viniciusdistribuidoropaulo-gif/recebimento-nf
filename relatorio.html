<!DOCTYPE html>
<html lang="pt-BR">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Relatório do Dia</title>

<style>

body{
margin:0;
font-family:Arial;
background:#f3f4f6;
}

.container{
padding:10px;
}

.card{

background:white;
border-radius:12px;
padding:15px;
box-shadow:0 3px 15px rgba(0,0,0,.10);

}

h1{
text-align:center;
}


.item{

border-bottom:1px solid #ddd;
padding:12px 0;

}


.produto{

font-weight:bold;
color:#2563eb;

}


button{

width:100%;
padding:14px;
margin-top:15px;
border:0;
border-radius:8px;
background:#2563eb;
color:white;
font-size:17px;
font-weight:bold;

}


</style>

</head>


<body>


<div class="container">

<div class="card">


<h1>📋 Relatório do Dia</h1>


<div id="lista">

Carregando...

</div>


<button onclick="voltar()">

⬅ VOLTAR

</button>


</div>

</div>



<script>


const API = 
"https://script.google.com/macros/s/AKfycbw0Htneq-gBaYAcyvgJgR2hQ-0QEgzhYYOXsDW0bIAG4_WbVxewtOT7AFNhqnRE5w8Z8w/exec";



fetch(API+"?relatorio=hoje")


.then(res=>res.json())


.then(dados=>{


let lista=document.getElementById("lista");


lista.innerHTML="";


dados.forEach(r=>{


lista.innerHTML += `

<div class="item">

<div>
<b>NF:</b> ${r.nf}
</div>


<div class="produto">
${r.produto}
</div>


<div>
Código: ${r.codigo}
</div>


<div>
Quantidade: ${r.quantidade}
</div>


<div>
Usuário: ${r.usuario}
</div>


<div>
Lote: ${r.lote}
</div>


<div>
Validade: ${r.validade}
</div>


</div>

`;


});


})


.catch(()=>{


document.getElementById("lista").innerHTML=
"Erro ao carregar relatório";


});




function voltar(){

window.location.href="app.html";

}


</script>


</body>

</html>
