<!DOCTYPE html>
<html lang="pt-BR">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Recebimento de NF</title>


<style>

*{
box-sizing:border-box;
}

body{
margin:0;
font-family:Arial,sans-serif;
background:#f3f4f6;
color:#222;
}


.container{
    width:100%;
    max-width:100%;
    margin:0;
    padding:5px;
}


.card{
    background:white;
    border-radius:12px;
    padding:12px;
    box-shadow:0 3px 15px rgba(0,0,0,0.10);
    width:100%;
}


@media (max-width:600px){

.container{
    padding:5px;
}

.card{
    padding:12px;
}

h1{
    font-size:21px;
}

input{
    font-size:17px;
    padding:14px;
}

button{
    font-size:18px;
}

}
   
.logo-app{

    width:70px;
    height:70px;
    object-fit:contain;
    display:block;
    margin:0 auto 10px auto;


}

h1{
text-align:center;
margin-top:0;
color:#1f2937;
}


label{
display:block;
margin-top:18px;
margin-bottom:7px;
font-weight:bold;
}


input{
width:100%;
padding:15px;
border:1px solid #ccc;
border-radius:8px;
font-size:18px;
}


.resultado{
border:1px solid #ddd;
border-radius:8px;
margin-top:5px;
overflow:hidden;
}


.produto{
padding:12px;
cursor:pointer;
border-bottom:1px solid #eee;
background:white;
}


.produto:hover{
background:#f0f7ff;
}


.codigo{
font-weight:bold;
color:#2563eb;
}


.selecionado{
margin-top:10px;
padding:12px;
background:#ecfdf5;
border:1px solid #10b981;
border-radius:8px;
}


button{

width:100%;
margin-top:25px;
padding:15px;
border:0;
border-radius:8px;
background:#2563eb;
color:white;
font-size:17px;
font-weight:bold;
cursor:pointer;

}


button:hover{
background:#1d4ed8;
}


.mensagem{
text-align:center;
margin-top:15px;
font-weight:bold;
}

</style>

</head>


<body>


<div class="container">


<div class="card">

<img src="icons.png" class="logo-app">



<h1>📦 Recebimento de NF</h1>


<label>Número da NF</label>

<input id="nf" placeholder="Digite o número da NF">



<label>Produto</label>

<input 
id="pesquisa"
placeholder="Digite código ou nome do produto"
autocomplete="off">



<div id="resultados" class="resultado"></div>



<div id="selecionado" class="selecionado" style="display:none">

<strong>Produto selecionado:</strong>

<div id="produtoNome"></div>

<div id="produtoCodigo"></div>

</div>



<label>Quantidade</label>

<input 
type="number"
id="quantidade"
placeholder="Digite a quantidade">



<label>Lote</label>

<input 
id="lote"
placeholder="Digite o lote">



<label>Validade</label>

<input 
type="date"
id="validade">



<button onclick="salvar()">

REGISTRAR RECEBIMENTO

</button>



<div id="mensagem" class="mensagem"></div>



</div>

</div>




<script>


let produtoSelecionado=null;



const API_PRODUTOS = 
"https://script.google.com/macros/s/AKfycbw0Htneq-gBaYAcyvgJgR2hQ-0QEgzhYYOXsDW0bIAG4_WbVxewtOT7AFNhqnRE5w8Z8w/exec";





// PESQUISA PRODUTO

document
.getElementById("pesquisa")
.addEventListener("input",function(){


let termo=this.value.trim();


let resultados=document.getElementById("resultados");


resultados.innerHTML="";



// LIMPA PRODUTO SE APAGAR A PESQUISA

if(!termo){

    produtoSelecionado=null;

    document.getElementById("selecionado").style.display="none";

    return;

}



// AGUARDA 3 CARACTERES PARA PESQUISAR

if(termo.length < 3){

    resultados.innerHTML =
    '<div class="produto">Digite pelo menos 3 caracteres...</div>';

    return;

}



fetch(API_PRODUTOS + "?termo=" + termo)


.then(res=>res.json())


.then(produtos=>{


produtos.forEach(p=>{


let div=document.createElement("div");


div.className="produto";


div.innerHTML=`

<div class="codigo">
${p.codigo}
</div>

<div>
${p.produto}
</div>

`;



div.onclick=function(){


produtoSelecionado=p;


document.getElementById("pesquisa").value=p.produto;


resultados.innerHTML="";


document.getElementById("selecionado").style.display="block";


document.getElementById("produtoNome").innerHTML=p.produto;


document.getElementById("produtoCodigo").innerHTML=
"Código: "+p.codigo;


};



resultados.appendChild(div);



});



})


.catch(()=>{

resultados.innerHTML="Erro ao consultar produtos";

});


});







// SALVAR RECEBIMENTO


function salvar(){



let mensagem=document.getElementById("mensagem");


let nf=document.getElementById("nf").value;


let quantidade=document.getElementById("quantidade").value;


let lote=document.getElementById("lote").value;


let validade=document.getElementById("validade").value;



if(!nf){

mensagem.innerHTML="⚠ Informe o número da NF";

return;

}



if(!produtoSelecionado){

mensagem.innerHTML="⚠ Selecione um produto";

return;

}



if(!quantidade){

mensagem.innerHTML="⚠ Informe a quantidade";

return;

}




let dados={

nf:nf,

codigo:produtoSelecionado.codigo,

produto:produtoSelecionado.produto,

quantidade:quantidade,

lote:lote,

validade:validade

};




fetch(API_PRODUTOS,{

method:"POST",

body:JSON.stringify(dados)

})


.then(res=>res.text())


.then(()=>{


mensagem.innerHTML=
"✓ Recebimento registrado com sucesso!";


mensagem.style.color="#059669";



document.getElementById("nf").value="";

document.getElementById("pesquisa").value="";

document.getElementById("quantidade").value="";

document.getElementById("lote").value="";

document.getElementById("validade").value="";


document.getElementById("selecionado").style.display="none";


produtoSelecionado=null;


})


.catch(()=>{


mensagem.innerHTML=
"⚠ Erro ao salvar recebimento";


mensagem.style.color="#dc2626";


});



}




</script>


</body>

</html>
