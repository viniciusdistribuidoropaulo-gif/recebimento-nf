<!DOCTYPE html>
<html lang="pt-BR">

<head>

<meta charset="UTF-8">

<title>Recebimento de NF</title>


<style>

*{
box-sizing:border-box;
}

body{
margin:0;
font-family:Arial,sans-serif;
background:#f3f4f6;
color:#222;
}


.container{
max-width:600px;
margin:30px auto;
padding:20px;
}


.card{
background:white;
border-radius:16px;
padding:25px;
box-shadow:0 3px 15px rgba(0,0,0,0.10);
}


h1{
text-align:center;
margin-top:0;
color:#1f2937;
}


label{
display:block;
margin-top:18px;
margin-bottom:7px;
font-weight:bold;
}


input{
width:100%;
padding:13px;
border:1px solid #ccc;
border-radius:8px;
font-size:16px;
}


.resultado{
border:1px solid #ddd;
border-radius:8px;
margin-top:5px;
overflow:hidden;
}


.produto{
padding:12px;
cursor:pointer;
border-bottom:1px solid #eee;
background:white;
}


.produto:hover{
background:#f0f7ff;
}


.codigo{
font-weight:bold;
color:#2563eb;
}


.selecionado{
margin-top:10px;
padding:12px;
background:#ecfdf5;
border:1px solid #10b981;
border-radius:8px;
}


button{

width:100%;
margin-top:25px;
padding:15px;
border:0;
border-radius:8px;
background:#2563eb;
color:white;
font-size:17px;
font-weight:bold;
cursor:pointer;

}


button:hover{
background:#1d4ed8;
}


.mensagem{
text-align:center;
margin-top:15px;
font-weight:bold;
}


</style>

</head>


<body>


<div class="container">


<div class="card">


<h1>📦 Recebimento de NF</h1>


<label>Número da NF</label>

<input 
id="nf"
placeholder="Digite o número da NF">



<label>Produto</label>

<input 
id="pesquisa"
placeholder="Digite código ou nome do produto"
autocomplete="off">



<div id="resultados" class="resultado"></div>



<div id="selecionado" class="selecionado" style="display:none">

<strong>Produto selecionado:</strong>

<div id="produtoNome"></div>

<div id="produtoCodigo"></div>

</div>



<label>Quantidade</label>

<input 
type="number"
id="quantidade"
placeholder="Digite a quantidade">



<label>Lote</label>

<input 
id="lote"
placeholder="Digite o lote">



<label>Validade</label>

<input 
type="date"
id="validade">



<button onclick="salvar()">

REGISTRAR RECEBIMENTO

</button>



<div id="mensagem" class="mensagem"></div>



</div>

</div>




<script>


let produtoSelecionado=null;



const API_PRODUTOS = 
"https://script.google.com/macros/s/AKfycbw0Htneq-gBaYAcyvgJgR2hQ-0QEgzhYYOXsDW0bIAG4_WbVxewtOT7AFNhqnRE5w8Z8w/exec";



document
.getElementById("pesquisa")
.addEventListener("input",function(){



let termo=this.value.trim();


let resultados=document.getElementById("resultados");


resultados.innerHTML="";



if(!termo){

return;

}



fetch(API_PRODUTOS + "?termo=" + termo)


.then(res=>res.json())


.then(produtos=>{



produtos.forEach(p=>{


let div=document.createElement("div");


div.className="produto";


div.innerHTML=

`

<div class="codigo">
${p.codigo}
</div>

<div>
${p.produto}
</div>

`;



div.onclick=function(){


produtoSelecionado=p;


document.getElementById("pesquisa").value=p.produto;


resultados.innerHTML="";


document.getElementById("selecionado").style.display="block";


document.getElementById("produtoNome").innerHTML=p.produto;


document.getElementById("produtoCodigo").innerHTML=
"Código: "+p.codigo;


};



resultados.appendChild(div);



});



})


.catch(()=>{

resultados.innerHTML=
"Erro ao consultar produtos";

});


});






function salvar(){


let mensagem=document.getElementById("mensagem");


let nf=document.getElementById("nf").value;


let quantidade=document.getElementById("quantidade").value;



if(!nf){

mensagem.innerHTML="⚠ Informe o número da NF";

return;

}



if(!produtoSelecionado){

mensagem.innerHTML="⚠ Selecione um produto";

return;

}



if(!quantidade){

mensagem.innerHTML="⚠ Informe a quantidade";

return;

}



mensagem.innerHTML=
"✓ Recebimento registrado com sucesso!";


mensagem.style.color="#059669";



console.log({

NF:nf,

Produto:produtoSelecionado,

Quantidade:quantidade,

Lote:document.getElementById("lote").value,

Validade:document.getElementById("validade").value

});


}


</script>


</body>

</html>
